<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Static Website Lab</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f7fb;
            text-align: center;
        }

        header {
            background: #0078d4;
            color: white;
            padding: 50px 20px;
        }

        main {
            padding: 50px 20px;
        }

        .card {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Azure Static Website</h1>
        <p>Hosted using Azure Storage</p>
    </header>

    <main>
        <div class="card">
            <h2>Welcome!</h2>

            <p>
                This website is hosted on Azure Storage
                without using a virtual machine.
            </p>

            <p>
                Cloud Security Engineering Lab
            </p>
        </div>
    </main>

    <footer>
        Azure Static Website Lab - 2026
    </footer>

</body>
</html>
